<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extra Life 26 — Party Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Saira+Condensed:wght@600;700&family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>
:root{
  --bg-1:#2B3644; --bg-2:#1B242F;
  --steel-1:#E8EDF3; --steel-2:#AAB6C4; --steel-3:#6E7B8C; --steel-4:#47525F;
  --plate-1:#2A3340; --plate-2:#10161E;
  --gold:#FFD200; --ink:#fff;
  --p1:#C0392B; --p2:#2E5FA3; --p3:#D9A800; --p4:#27953F;
  --display:"Archivo Black",Impact,sans-serif;
  --cond:"Saira Condensed","Arial Narrow",sans-serif;
  --round:"M PLUS Rounded 1c",system-ui,sans-serif;
  --card-h:282px;              /* seat card height; the seat row reserves card + 11px */
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100vh;font-family:var(--cond);color:var(--ink);
  -webkit-font-smoothing:antialiased;background:var(--bg-2);
  background-image:
    linear-gradient(112deg,transparent 0 12%,rgba(255,255,255,.045) 12% 19%,transparent 19% 26%,rgba(255,255,255,.03) 26% 30%,transparent 30%),
    linear-gradient(292deg,transparent 0 14%,rgba(255,255,255,.05) 14% 22%,transparent 22%),
    linear-gradient(168deg,var(--bg-1) 0%,var(--bg-2) 55%,#131A23 100%);
  display:flex;justify-content:center;padding:22px 16px 30px;
}
body.gloved,body.gloved *{cursor:none}
.stage{width:100%;display:flex;flex-direction:column;gap:14px}
.stage>*{flex-shrink:0}        /* overflow scrolls; it must not squash the footer/bar */

/* join */
.join{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(8,12,19,.93)}
.joinBox{width:min(430px,92vw);padding:3px;border-radius:9px;
  background:linear-gradient(158deg,var(--steel-1),var(--steel-2) 32%,var(--steel-3) 62%,var(--steel-4));
  box-shadow:0 12px 40px rgba(0,0,0,.7)}
.joinIn{background:linear-gradient(180deg,#1C2735,#0C121B);border-radius:7px;padding:24px;display:flex;flex-direction:column;gap:16px}
.joinIn h1{margin:0;font-family:var(--display);font-size:25px;line-height:1;transform:skewX(-10deg);
  background:linear-gradient(180deg,#FDFEFF,#C3CDD9 45%,#7C8998 55%,#E3E9F0);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #20282F}
.joinIn label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8B9AAC;display:block;margin-bottom:5px}
.joinIn input{width:100%;background:rgba(6,10,17,.85);border:1px solid #47566B;color:#fff;font:inherit;font-size:17px;padding:8px 11px;border-radius:3px}
.joinIn input:focus{outline:none;border-color:var(--gold)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.roleBtn{border:1px solid #47566B;background:rgba(6,10,17,.7);color:#B9C6D6;font:inherit;font-weight:700;
  font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:9px 4px;border-radius:3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.roleBtn small{font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:none;color:#6F7F92}
.roleBtn.sel{background:linear-gradient(180deg,var(--gold),#B08800);color:#151A22;border-color:var(--gold)}
.roleBtn.sel small{color:#3A2E08}
.goBtn{border:0;border-radius:4px;font:inherit;font-weight:700;font-size:16px;letter-spacing:.12em;
  text-transform:uppercase;padding:11px;cursor:pointer;color:#151A22;
  background:linear-gradient(180deg,var(--gold),#B08800);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.goBtn:disabled{opacity:.4;cursor:default}
.pwMsg{margin-top:6px;font-size:12px;font-weight:600;color:#E8736A}
.escape{position:fixed;left:8px;bottom:6px;z-index:80;border:0;background:transparent;
  color:rgba(255,255,255,.16);font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:4px 6px}
.escape:hover{color:rgba(255,255,255,.7)}

/* top bar */
.bar{display:flex;align-items:center;gap:10px}
.melee{font-family:var(--display);font-size:38px;line-height:.9;transform:skewX(-12deg);
  background:linear-gradient(180deg,#FDFEFF,#C3CDD9 42%,#7C8998 55%,#E3E9F0);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #20282F;
  white-space:nowrap;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
.vsbadge{width:96px;height:66px;flex:none;margin:0 -6px 0 -10px}
.vsbadge svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.title{flex:1;min-width:0;padding:2px;background:linear-gradient(180deg,var(--steel-1),var(--steel-3) 50%,var(--steel-4));
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.title .inner{background:linear-gradient(180deg,#1E2833,#0B1118 55%,#172029);
  clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%);padding:6px 24px}
.title span{display:block;text-align:center;font-family:var(--round);font-weight:700;font-size:17px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.title span em{font-style:normal;color:var(--gold)}

/* roster. --tw (tile width) and --cols are set by fitRoster() on desktop;
   the fallbacks are the old 9 x 104px grid, which phones still use. */
.roster{align-self:center;width:calc(var(--cols,9) * var(--tw,104px) + (var(--cols,9) - 1) * 3px);
  display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.tile{width:var(--tw,104px);padding:2px;border:0;font:inherit;color:inherit;display:block;position:relative;
  background:linear-gradient(160deg,var(--steel-1),var(--steel-2) 38%,var(--steel-3) 62%,var(--steel-4));
  box-shadow:0 2px 3px rgba(0,0,0,.5);transition:transform .08s ease,filter .08s ease}
.tile.hot{transform:translateY(-3px) scale(1.05);filter:brightness(1.2);z-index:4}
.tile .art{position:relative;aspect-ratio:13/9;overflow:hidden;background:linear-gradient(165deg,var(--a1),var(--a2))}
/* Portrait images (tile art 13:9, seat portrait 1:1). Untagged: cover, biased
   to the top where faces are. Tagged (img.framed): frameFace() writes
   left/top/width/height in % of the frame. */
.tile .art img,.portrait img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;max-height:none;
  object-fit:cover;object-position:50% 15%;display:block}
.tile .art img.framed,.portrait img.framed{object-fit:fill}
.tile .initials{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);
  font-size:26px;color:rgba(30,40,52,.78);text-shadow:0 1px 0 rgba(255,255,255,.45)}
.tile .plate{background:linear-gradient(180deg,var(--plate-1),var(--plate-2));font-weight:700;font-size:10.5px;
  line-height:17px;height:17px;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding:0 2px;color:#F2F6FB;text-shadow:0 1px 1px rgba(0,0,0,.9)}
.tile .pucks{position:absolute;inset:0;z-index:3;pointer-events:none}
.tile .pucks .puck{position:absolute;transform:translate(-50%,-50%)}

/* puck */
.puck{font-family:var(--display);font-size:12px;line-height:1;color:#fff;
  background:radial-gradient(120% 95% at 50% 8%,rgba(255,255,255,.72),rgba(255,255,255,0) 58%),
    linear-gradient(180deg,color-mix(in srgb,var(--pc) 78%,#fff) 0%,var(--pc) 44%,color-mix(in srgb,var(--pc) 62%,#000) 100%);
  border:2px solid #fff;border-radius:999px;padding:4px 7px;white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.75);
  box-shadow:0 2px 5px rgba(0,0,0,.7),0 0 0 2px rgba(0,0,0,.45),inset 0 -2px 3px rgba(0,0,0,.35)}
.puck.big{font-size:16px;padding:7px 11px;border-width:3px}

/* cards */
/* The seat row always reserves a full card's height, so the first player
   joining does not shove the roster around (and fitRoster sees a constant). */
.slots{align-self:center;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;max-width:100%;min-height:calc(var(--card-h) + 11px)}
.waiting{align-self:center;padding:34px 10px;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#6F8098}
.slot{width:210px;position:relative;border:0;padding:11px 0 0;font:inherit;color:inherit;background:transparent}
.hmn{position:absolute;left:8px;top:0;z-index:3;padding:1px;border-radius:2px;background:linear-gradient(180deg,var(--steel-2),var(--steel-4))}
.hmn i{display:block;background:linear-gradient(180deg,#232C37,#0E141B);font-style:normal;font-weight:700;font-size:12px;
  letter-spacing:.08em;line-height:1;padding:3px 9px;color:#EDF2F8;max-width:180px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;border-radius:1px}
.hmn.mine i{background:linear-gradient(180deg,var(--gold),#A8860B);color:#171C24}
.card{background:linear-gradient(158deg,var(--steel-1),var(--steel-2) 30%,var(--steel-3) 60%,var(--steel-4));
  padding:3px;border-radius:7px;height:var(--card-h);display:flex;flex-direction:column;box-shadow:0 4px 8px rgba(0,0,0,.55)}
.slot.mine .card{box-shadow:0 0 0 3px var(--gold),0 4px 12px rgba(0,0,0,.6)}
.slot.hot .card{box-shadow:0 0 0 3px #fff,0 4px 14px rgba(0,0,0,.6)}
.card .fill{flex:1;border-radius:5px;overflow:hidden;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.24),transparent 62%),
    linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 62%,#06080C))}
.card.blank .fill{background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.1),transparent 62%),linear-gradient(180deg,#3A4756,#1A222C)}
.card .art{flex:1;display:grid;place-items:center;min-height:0;padding:10px}
.portrait{position:relative;width:104px;height:104px;border-radius:4px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(165deg,var(--a1),var(--a2));font-family:var(--display);font-size:34px;
  color:rgba(28,38,50,.8);text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 4px 12px rgba(0,0,0,.45)}
.card .empty{font-weight:700;font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.55);text-align:center;line-height:1.8}
.dock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}
.namewrap{padding:0 10px 4px}
.namewrap .np{background:linear-gradient(180deg,var(--steel-2),var(--steel-4));padding:1px;border-radius:3px}
.namewrap .np b{display:block;background:linear-gradient(180deg,#222A35,#0D131A);border-radius:2px;font-family:var(--round);
  font-weight:700;font-size:16px;line-height:1.35;text-align:center;padding:1px 6px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.85)}
.pnumband{background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.55));border-radius:0 0 5px 5px;padding:3px 0 7px 14px}
.pnum{font-family:var(--display);font-style:italic;font-size:28px;line-height:1;text-align:left;
  background-image:linear-gradient(180deg,#E9EEF5,#9AA6B4 48%,#6A7684 52%,#D6DDE6);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(20,26,34,.85)}

/* footer */
/* Fixed height on desktop, even when empty (viewer), so every role at the same
   window size gets the same roster grid: peer gloves are drawn by viewport
   fraction and only point at the right tile if the layouts match. */
.footer{align-self:center;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;font-size:14px;font-weight:600;color:#93A2B4;
  height:32px}
.roleTag{font-size:11px;font-weight:700;letter-spacing:.14em;padding:3px 8px;border:1px solid #4A5768;color:#8B9AAC}
.roleTag.live{color:var(--gold);border-color:#A8860B}
.hint b{color:var(--gold)}
.startBtn{font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:6px 15px;border:0;border-radius:3px;
  color:#171C24;background:linear-gradient(180deg,var(--gold),#B08800);box-shadow:0 2px 5px rgba(0,0,0,.5);cursor:pointer}
.startBtn.on{background:linear-gradient(180deg,#E8564A,#96271C);color:#fff}
.startBtn.wipe{background:linear-gradient(180deg,#7C8899,#4A5867);color:#fff}

/* jeopardy board */
#jeopardy{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;gap:10px;
  padding:16px 18px 14px;background:radial-gradient(120% 90% at 50% 0%,#132a6b 0%,#0a1330 55%,#070b18 100%)}
#jeopardy.on{display:flex}
.jbHead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.jbTitle{font-family:var(--display);font-style:italic;font-size:clamp(17px,2.3vw,30px);color:#fff;letter-spacing:.01em}
.jbPage{font-family:var(--display);font-size:clamp(10px,1.2vw,14px);letter-spacing:.22em;color:#8ea4c8}
.jbGrid{flex:1;display:grid;grid-auto-rows:1fr;gap:7px;min-height:0}
.jbCat{display:grid;place-items:center;text-align:center;padding:8px 6px;border-radius:3px;
  background:linear-gradient(180deg,#24499f,#15306e);border:1px solid #3059b8;
  font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;line-height:1.12;
  font-size:clamp(9px,.95vw,14px);color:#fff}
.jbCell{display:grid;place-items:center;border-radius:3px;
  background:linear-gradient(180deg,#16307c,#0d1d50);border:1px solid #2a4fae;
  font-family:var(--display);font-size:clamp(18px,3vw,44px);color:var(--gold);
  text-shadow:0 3px 0 rgba(0,0,0,.6);transition:transform .1s,filter .1s}
.jbCell.pick{cursor:pointer}
.jbCell.pick:hover{filter:brightness(1.35);transform:translateY(-2px)}
.jbCell.used{background:#060a16;border-color:#101729;color:transparent;text-shadow:none;pointer-events:none}
.jbClue{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,2.6vh,30px);text-align:center;padding:clamp(18px,3vw,46px);border-radius:4px;
  background:linear-gradient(180deg,#24499f,#0d1d50);border:1px solid #3059b8}
.jbVal{font-family:var(--display);font-size:clamp(11px,1.3vw,17px);letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.jbQ{font-family:var(--display);font-size:clamp(17px,2.6vw,40px);line-height:1.28;color:#fff;max-width:17ch;max-width:min(1150px,92%)}
.jbA{font-family:var(--display);font-style:italic;font-size:clamp(16px,2.2vw,34px);color:var(--gold);
  border-top:1px solid rgba(255,255,255,.18);padding-top:clamp(10px,1.8vh,22px);max-width:min(1150px,92%)}
.jbBar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.jbDone{flex:1;display:grid;place-items:center;font-family:var(--display);font-style:italic;
  font-size:clamp(20px,3vw,44px);color:var(--gold);text-align:center}

/* ready banner */
.ready{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none}
.ready[hidden]{display:none}
.ready .slash{width:140%;padding:14px 0 18px;text-align:center;transform:rotate(-5deg);
  background:linear-gradient(180deg,rgba(205,32,24,0) 0%,rgba(205,32,24,.94) 14%,rgba(150,18,12,.96) 86%,rgba(150,18,12,0) 100%);
  box-shadow:0 0 60px rgba(220,40,30,.55);border-top:2px solid rgba(255,190,60,.5);border-bottom:2px solid rgba(255,190,60,.5)}
.ready h2{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(32px,6vw,70px);line-height:1;
  background-image:linear-gradient(180deg,#FFF6C6,#FFD84A 46%,#E09A08 54%,#FFF0B0);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #4A1008;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.6))}
.ready p{margin:4px 0 0;font-family:var(--display);font-size:clamp(12px,1.8vw,20px);letter-spacing:.22em;
  color:rgba(255,255,255,.9);text-shadow:0 2px 3px rgba(0,0,0,.6)}

/* gloves */
.gloves{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.glove{position:absolute;left:0;top:0;width:58px;height:64px;will-change:transform;transition:transform .06s linear}
.glove.me{transition:none}
.glove .art{position:absolute;inset:0}
.glove .art svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.glove .carry{position:absolute;left:20px;top:26px;z-index:2}
.glove .who{position:absolute;left:28px;top:56px;font-family:var(--cond);font-weight:700;font-size:11px;
  color:#fff;background:rgba(10,14,20,.85);padding:1px 6px;border-radius:2px;white-space:nowrap;max-width:150px;
  overflow:hidden;text-overflow:ellipsis}

/* Short desktop windows (1366x768 laptops, windowed browsers): tighter
   padding and gaps and a shorter seat card, so the roster keeps >= 64px tiles.
   The card still holds the 104px portrait (art area 210-30-38 = 142px). */
@media (min-width:901px) and (max-height:860px){
  :root{--card-h:216px}
  body{padding:12px 12px}
  .stage{gap:10px}
}
@media (max-width:900px){.roster{width:100%}.melee{font-size:26px}
  .slots{min-height:120px}.footer{height:auto}}
</style>
</head>
<body>

<div class="join" id="join">
  <div class="joinBox"><div class="joinIn">
    <h1>EXTRA LIFE 26</h1>
    <div>
      <label for="jn">Your name</label>
      <input id="jn" maxlength="20" placeholder="e.g. Dan" autocomplete="off">
    </div>
    <div>
      <label>I am a…</label>
      <div class="roles">
        <button class="roleBtn" data-role="player" type="button">Player<small>pick a fighter</small></button>
        <button class="roleBtn" data-role="viewer" type="button">Viewer<small>watch only</small></button>
        <button class="roleBtn" data-role="admin"  type="button">Admin<small>run the show</small></button>
      </div>
    </div>
    <div id="pwRow" hidden>
      <label for="pw">Admin password</label>
      <input id="pw" type="password" placeholder="password" autocomplete="off">
      <div class="pwMsg" id="pwMsg" hidden>That isn't it.</div>
    </div>
    <button class="goBtn" id="go" type="button" disabled>Enter</button>
  </div></div>
</div>

<div class="stage">
  <div class="bar">
    <div class="melee">PARTY</div>
    <div class="vsbadge" aria-label="versus">
      <svg viewBox="0 0 104 72" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 58 H60 a38 38 0 0 0 30-16 L104 24" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="9" stroke-linecap="round"/>
        <path d="M0 66 H58 a44 44 0 0 0 34-18 L104 34" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="40" cy="32" r="25" fill="rgba(20,28,40,.55)" stroke="rgba(255,255,255,.34)" stroke-width="2"/>
        <circle cx="40" cy="32" r="20" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.6" stroke-dasharray="3 4"/>
        <text x="40" y="41" text-anchor="middle" font-family="Archivo Black,Impact,sans-serif" font-size="21"
              font-style="italic" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.6" letter-spacing="-1">VS</text>
      </svg>
    </div>
    <div class="title"><div class="inner"><span id="banner">Assemble your party</span></div></div>
  </div>
  <div class="roster" id="roster"></div>
  <div class="slots" id="slots"></div>
  <div class="footer" id="footer"></div>
</div>

<div class="gloves" id="gloves"></div>
<div id="jeopardy"></div>
<div class="ready" id="ready" hidden>
  <div class="slash"><h2>READY TO FIGHT</h2><p>THE ADVENTURE AWAITS</p></div>
</div>

<script>
/* ==================================================================
   CONFIG — edit these three, then the roster below.
================================================================== */

/* The party's opposition, shown after "vs" in the top banner. */
const OPPOSITION = "Adventure";

/* ROSTER — `name` required; `series`, `img` and `face` optional.
   With no img the tile shows initials on a colour derived from the name.
   face:[cx, cy, fh] frames the picture on the face: cx/cy are the centre of
   the face box and fh its height (top of the hair to the chin), all as
   fractions of the original image. Without it the picture is cover-cropped
   from near the top. */
const ROSTER = [
  { name:"Goku", series:"Dragon Ball", face:[0.485,0.188,0.115] },               { name:"Vegeta", series:"Dragon Ball", face:[0.585,0.218,0.145] },

/* Jeopardy state. One object, mirrored into board.game so every screen
   (players, the OBS viewer, a page reloaded mid-show) lands on the same
   view. used holds "page-cat-row" keys and is never cleared by Clear
   board, so wiping the seats mid-show does not lose trivia progress. */
let game = { started:false, page:0, open:null, revealed:false, used:[] };
const gameKey = (p,c,r) => p+"-"+c+"-"+r;
const isUsed  = (p,c,r) => game.used.indexOf(gameKey(p,c,r))>=0;
const curBoard = () => BOARDS[Math.max(0,Math.min(game.page,BOARDS.length-1))];
const clueCount = b => b.cats.reduce((t,c)=>t+c.clues.length,0);
function usedOnPage(used,page){
  const b=BOARDS[Math.max(0,Math.min(page,BOARDS.length-1))]; let n=0;
  for(let c=0;c<b.cats.length;c++) for(let r=0;r<b.cats[c].clues.length;r++)
    if(used.indexOf(gameKey(page,c,r))>=0) n++;
  return n;
}
function applyGame(g){
  if(!g || typeof g!=="object") return;
  game = {
    started: !!g.started,
    page: Number(g.page)||0,
    open: (g.open && typeof g.open.c==="number" && typeof g.open.r==="number") ? { c:g.open.c, r:g.open.r } : null,
    revealed: !!g.revealed,
    used: Array.isArray(g.used) ? g.used.slice() : [],
  };
}

const CAN_PLAY = () => ROLE==="player" || ROLE==="admin";
const CAN_SEAT = () => ROLE==="player";                    // the admin hosts; they take no slot
const seatOf = n => { const s=slots[String(n)]; return s && s.viewer_id ? s : null; };
const mySlot = () => { for(let n=1;n<=SLOT_COUNT;n++){const s=seatOf(n);if(s&&s.viewer_id===myId)return n;} return null; };
const charIn = n => { const s=seatOf(n); return s&&s.character_id&&!s.held ? BY_ID.get(s.character_id) : null; };
const carrying = () => { const n=mySlot(); const s=n!==null?seatOf(n):null; return s&&s.held ? n : null; };
const pucksOn = id => {
  const out=[];
  for(let n=1;n<=SLOT_COUNT;n++){
    const s=seatOf(n);
    if(s && !s.held && s.character_id===id)
      out.push({ n, px: typeof s.px==="number"?s.px:0.5, py: typeof s.py==="number"?s.py:0.32 });
  }
  return out;
};
function allPlaced(){
  let claimed=0;
  for(let n=1;n<=SLOT_COUNT;n++){
    const s=seatOf(n); if(!s) continue;
    claimed++;
    if(s.held || !s.character_id) return false;
  }
  return claimed>0;
}
const bannerOn = () => !game.started && (allPlaced() || adminLock);

/* ---------- writes (every one goes to the server) ---------- */
function pushSeat(n, patch){
  const cur = slots[String(n)] || {};
  slots[String(n)] = { ...cur, ...patch, seat:n, viewer_id:myId };   // optimistic
  render();
  sendMsg({ t:"seat", patch });
}
function setAdminLock(v){
  adminLock=v; render();
  sendMsg({ t:"lock", v });
}
function pushGame(patch){
  game = { ...game, ...patch }; render();
  sendMsg({ t:"game", patch });
}
function startGame(){   if(ROLE!=="admin") return; pushGame({ started:true,  open:null, revealed:false }); }
function backToSelect(){ if(ROLE!=="admin") return; pushGame({ started:false, open:null, revealed:false }); }
function openClue(c,r){
  if(ROLE!=="admin" || game.open || isUsed(game.page,c,r)) return;
  pushGame({ open:{c,r}, revealed:false });
}
function revealClue(){ if(ROLE!=="admin" || !game.open) return; pushGame({ revealed:true }); }
/* Marks the clue done and goes back to the grid. Clearing the last cell
   on a board moves straight to the next one, so the night flows
   board 1 -> board 2 -> board 3 without an extra click. */
function nextClue(){
  if(ROLE!=="admin" || !game.open) return;
  const k = gameKey(game.page, game.open.c, game.open.r);
  const used = game.used.indexOf(k)>=0 ? game.used : game.used.concat([k]);
  const patch = { used, open:null, revealed:false };
  if(usedOnPage(used,game.page) >= clueCount(curBoard()) && game.page < BOARDS.length-1)
    patch.page = game.page+1;
  pushGame(patch);
}
function nextPage(){
  if(ROLE!=="admin" || game.page >= BOARDS.length-1) return;
  pushGame({ page:game.page+1, open:null, revealed:false });
}
function clearBoard(){
  if(ROLE!=="admin") return;
  slots={}; adminLock=false; seatFull=false;
  game = { ...game, started:false, open:null, revealed:false };
  render();
  sendMsg({ t:"clear" });
}

/* The server picks the lowest free seat under one lock and answers with the
   whole room, so there is no race to resolve here and no retry loop. */
function autoSeat(){
  if(!CAN_SEAT() || mySlot()!==null) return;
  sendMsg({ t:"claim" });
}

/* ---------- puck actions ---------- */
function liftPuck(){ const n=mySlot(); if(n===null||adminLock) return; pushSeat(n,{ held:true }); }
function placeOnTile(cid,px,py){ const n=carrying(); if(n===null) return; pushSeat(n,{ character_id:cid, px, py, held:false }); }
function placeBackOnSeat(){ const n=carrying(); if(n===null) return; pushSeat(n,{ character_id:"", held:false }); }

function onWorldPress(ev){
  if(game.started) return;                  // the jeopardy board owns the screen
  if(!CAN_PLAY()||adminLock) return;
  const tileEl = ev.target.closest && ev.target.closest("[data-char]");
  const slotEl = ev.target.closest && ev.target.closest("[data-seat]");
  const held = carrying(), mine = mySlot();

  if(held!==null){
    if(tileEl){
      const r = tileEl.getBoundingClientRect();
      const clamp = v => Math.min(0.93, Math.max(0.07, v));
      placeOnTile(tileEl.dataset.char, clamp((ev.clientX-r.left)/r.width), clamp((ev.clientY-r.top)/r.height));
      return;
    }
    if(slotEl && Number(slotEl.dataset.seat)===held){ placeBackOnSeat(); return; }
    return;
  }
  if(mine===null) return;
  const s = seatOf(mine);
  if(slotEl && Number(slotEl.dataset.seat)===mine){ liftPuck(); return; }
  if(tileEl && s && s.character_id===tileEl.dataset.char){ liftPuck(); return; }
}

/* ---------- render ---------- */
function puckEl(n,big){
  const d=document.createElement("div");
  d.className="puck"+(big?" big":"");
  d.style.setProperty("--pc",SLOT_HEX[n-1]);
  d.textContent="P"+n;
  return d;
}
/* Face framing. Zoom until the face box is FACE_FILL of the frame height,
   centre it across and put its centre FACE_Y down the frame, then clamp so
   the image always covers the frame. Worked in a W x 1 frame (W = aspect)
   and written as % of the frame, so it holds at any pixel size. An entry
   with no usable face tag keeps the CSS cover crop. */
const FACE_FILL = 0.60, FACE_Y = 0.45;
const ASPECT_TILE = 13/9, ASPECT_PORTRAIT = 1;
function frameFace(img, face, aspect){
  const iw=img.naturalWidth, ih=img.naturalHeight;
  if(!iw || !ih || !Array.isArray(face) || face.length!==3) return;
  const [cx,cy,fh]=face;
  if(![cx,cy,fh].every(v=>typeof v==="number" && isFinite(v)) || fh<=0) return;
  const W=aspect, H=1;
  const s=Math.max(W/iw, H/ih, FACE_FILL*H/(fh*ih));
  const dw=iw*s, dh=ih*s;
  const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
  const left=clamp(W/2-cx*iw*s, W-dw, 0);
  const top =clamp(FACE_Y*H-cy*ih*s, H-dh, 0);
  const pct=v=>(v*100).toFixed(3)+"%";
  img.classList.add("framed");
  img.style.left=pct(left/W);  img.style.top=pct(top/H);
  img.style.width=pct(dw/W);   img.style.height=pct(dh/H);
}
/* Portrait loader. With no img on the roster entry this tries images/<slug>.png,
   then .jpg, and leaves the placeholder in place if neither is there. `aspect`
   is the frame's width/height, for the face framing. */
function portraitInto(c, aspect, onLoad){
  const id=slug(c.name);
  const srcs = c.img ? [c.img] : ["images/"+id+".png","images/"+id+".jpg"];
  let k=0;
  const i=document.createElement("img"); i.alt="";
  i.addEventListener("load",()=>{ frameFace(i, c.face, aspect); onLoad(i); });
  i.addEventListener("error",()=>{ if(++k<srcs.length) i.src=srcs[k]; });
  i.src=srcs[0];
}
function renderRoster(){
  const host=document.getElementById("roster"); host.replaceChildren();
  for(const c of ROSTER){
    const id=slug(c.name);
    const tile=document.createElement("div");
    tile.className="tile"+(hotTarget&&hotTarget.kind==="tile"&&hotTarget.key===id?" hot":"");
    tile.dataset.char=id;
    tile.title=c.series?`${c.name} — ${c.series}`:c.name;
    const art=document.createElement("div"); art.className="art"; washFor(art,c.name);
    const v=document.createElement("div");v.className="initials";v.textContent=initialsFor(c.name);art.appendChild(v);
    portraitInto(c, ASPECT_TILE, i=>{ v.remove(); art.appendChild(i); });
    tile.appendChild(art);
    const on=pucksOn(id);
    if(on.length){
      const wrap=document.createElement("div"); wrap.className="pucks";
      for(const q of on){
        const el=puckEl(q.n);
        el.style.left=(q.px*100).toFixed(2)+"%";
        el.style.top=(q.py*100).toFixed(2)+"%";
        wrap.appendChild(el);
      }
      tile.appendChild(wrap);
    }
    const p=document.createElement("div"); p.className="plate"; p.textContent=c.name; tile.appendChild(p);
    host.appendChild(tile);
  }
}
function renderSlots(){
  const host=document.getElementById("slots"); host.replaceChildren();
  const joined=[];
  for(let n=1;n<=SLOT_COUNT;n++) if(seatOf(n)) joined.push(n);
  if(!joined.length){

    slot.dataset.seat=String(n);

    const hmn=document.createElement("div"); hmn.className="hmn"+(isMine?" mine":"");

function renderBanner(){
  const names=[];
  for(let n=1;n<=SLOT_COUNT;n++){const c=charIn(n); if(c) names.push(c.name);}
  const el=document.getElementById("banner"); el.replaceChildren();

  el.append(document.createTextNode(names.join(", ")+"  "));

  el.append(document.createTextNode("  "+OPPOSITION));
}
function renderFooter(){
  const host=document.getElementById("footer"); host.replaceChildren();
  if(ROLE==="viewer") return;                 // the broadcast source carries no chrome

  const tag=document.createElement("span");
  tag.className="roleTag"+(live?" live":"");
  tag.textContent=(ROLE||"").toUpperCase()+" · "+(live?"LIVE":"OFFLINE");
  host.appendChild(tag);

  const hint=document.createElement("span"); hint.className="hint";
  const held=carrying();
  hint.textContent = adminLock ? "Board locked by the host."
    : held!==null ? "Carrying your puck — click a fighter to place it."
    : seatFull ? `All ${SLOT_COUNT} seats are taken — watching.`
    : !CAN_SEAT() ? "Hosting the board. No seat, no puck; your glove still points."
    : mySlot()===null ? "Taking your seat…"
    : charIn(mySlot()) ? "Placed. Click your puck again to move it."
    : "Click your puck to pick it up.";

  if(ROLE==="admin"){
    const b=document.createElement("button");
    b.className="startBtn"+(adminLock?" on":""); b.type="button";

    b.addEventListener("click",e=>{e.stopPropagation();setAdminLock(!adminLock);});
    const w=document.createElement("button");
    w.className="startBtn wipe"; w.type="button"; w.textContent="Clear board";
    w.title="Free every seat";
    w.addEventListener("click",e=>{e.stopPropagation();clearBoard();});
    const g=document.createElement("button");
    g.className="startBtn"; g.type="button"; g.textContent="Start the game";

}
function jbBtn(label,fn,cls){
  const b=document.createElement("button"); b.type="button";
  b.className="startBtn"+(cls?" "+cls:""); b.textContent=label;
  b.addEventListener("click",e=>{ e.stopPropagation(); fn(); });
  return b;
}
function renderJeopardy(){
  const host=document.getElementById("jeopardy");
  host.classList.toggle("on", !!game.started);
  host.replaceChildren();
  if(!game.started) return;
  const b=curBoard(), isAdmin=ROLE==="admin";

  const head=document.createElement("div"); head.className="jbHead";
  const t=document.createElement("span"); t.className="jbTitle"; t.textContent=b.title;
  const p=document.createElement("span"); p.className="jbPage";
  p.textContent="Board "+(game.page+1)+" of "+BOARDS.length;
  head.append(t,p); host.appendChild(head);

  if(game.open){
    const cat=b.cats[game.open.c], cl=cat && cat.clues[game.open.r];
    const panel=document.createElement("div"); panel.className="jbClue";
    const v=document.createElement("div"); v.className="jbVal";
    v.textContent=(cat?cat.name:"")+"  •  $"+(cl?cl.v:0);
    const q=document.createElement("div"); q.className="jbQ"; q.textContent=cl?cl.q:"";
    panel.append(v,q);
    if(game.revealed){
      const a=document.createElement("div"); a.className="jbA"; a.textContent=cl?cl.a:"";
      panel.appendChild(a);
    }
    host.appendChild(panel);
  } else if(usedOnPage(game.used,game.page) >= clueCount(b)){
    const d=document.createElement("div"); d.className="jbDone";
    d.textContent="Board clear";
    host.appendChild(d);
  } else {
    const grid=document.createElement("div"); grid.className="jbGrid";
    grid.style.gridTemplateColumns="repeat("+b.cats.length+",1fr)";
    for(const c of b.cats){
      const h=document.createElement("div"); h.className="jbCat"; h.textContent=c.name;
      grid.appendChild(h);
    }
    const rows=b.cats.reduce((m,c)=>Math.max(m,c.clues.length),0);
    for(let r=0;r<rows;r++) for(let ci=0;ci<b.cats.length;ci++){
      const cl=b.cats[ci].clues[r], used=isUsed(game.page,ci,r);
      const cell=document.createElement("div");
      cell.className="jbCell"+(used?" used":(isAdmin&&cl?" pick":""));
      cell.textContent=cl?("$"+cl.v):"";
      if(cl && !used && isAdmin) cell.addEventListener("click",()=>openClue(ci,r));
      grid.appendChild(cell);
    }
    host.appendChild(grid);
  }

  if(isAdmin){
    const bar=document.createElement("div"); bar.className="jbBar";
    if(game.open){
      if(!game.revealed) bar.appendChild(jbBtn("Show answer",revealClue));
      bar.appendChild(jbBtn("Next",nextClue));
    }else{
      if(game.page < BOARDS.length-1) bar.appendChild(jbBtn("Next board",nextPage));
      bar.appendChild(jbBtn("Back to party select",backToSelect,"wipe"));
    }
    host.appendChild(bar);
  }
}
function render(){
  if(!ROLE) return;
  document.getElementById("ready").hidden = !bannerOn();
  renderRoster(); renderSlots(); renderBanner(); renderFooter(); renderGloves(); renderJeopardy();
}

      <path fill="var(--gC)" d="M29 31v-7.5a4.6 4.6 0 0 1 9.2 0V32"/>${thumb}
      <path fill="var(--gB)" d="M16 30h28a6.1 6.1 0 0 1 6.1 6.1v6A16.2 16.2 0 0 1 33.9 58.3h-7A14.1 14.1 0 0 1 12.8 44.2V33z"/>

}
const GLOVE_HUES = [
  { a:"#FFE2DE", b:"#F0736A", c:"#C93A2D", d:"#9E2A20" },
  { a:"#DDE9FB", b:"#5F93DF", c:"#2E5FA3", d:"#20447A" },
  { a:"#FFF2CC", b:"#F0C64A", c:"#C99A06", d:"#9A7505" },
  { a:"#DCF3E0", b:"#5DBE6C", c:"#27953F", d:"#1B6E2D" },
];
const GLOVE_PLAIN = { a:"#FFFFFF", b:"#EDF0F5", c:"#C9D0DA", d:"#AEB7C4" };

const gloveHost=document.getElementById("gloves");
const gloveEls=new Map();
let myPos={x:.5,y:.5};

function gloveFor(key){
  let el=gloveEls.get(key);
  if(!el){
    el=document.createElement("div");
    el.className="glove"+(key==="me"?" me":"");
    const art=document.createElement("div"); art.className="art";
    const carry=document.createElement("div"); carry.className="carry";
    const who=document.createElement("div"); who.className="who";
    el.append(art,carry,who); el._key="";
    gloveHost.appendChild(el); gloveEls.set(key,el);

}
function paintGlove(key,x,y,pose,slotNum,name){
  const el=gloveFor(key);
  el.style.transform=`translate(${x*window.innerWidth}px,${y*window.innerHeight}px)`;
  const hue = slotNum ? GLOVE_HUES[slotNum-1] : GLOVE_PLAIN;
  el.style.setProperty("--gA",hue.a); el.style.setProperty("--gB",hue.b);
  el.style.setProperty("--gC",hue.c); el.style.setProperty("--gD",hue.d);
  const sig = pose+"|"+(slotNum||"");
  if(el._key!==sig){ el.querySelector(".art").innerHTML = gloveSVG(pose, slotNum?"P"+slotNum:""); el._key=sig; }
  const carry=el.querySelector(".carry"); carry.replaceChildren();
  if(pose==="grab"&&slotNum) carry.appendChild(puckEl(slotNum));
  const who=el.querySelector(".who"); who.textContent=name||""; who.hidden=!name;
}
function myPose(){ if(carrying()!==null) return "grab"; return hotTarget ? "point" : "open"; }
function renderGloves(){
  if(CAN_PLAY()) paintGlove("me",myPos.x,myPos.y,myPose(),mySlot(),myName);
  const seen=new Set(CAN_PLAY()?["me"]:[]);
  for(const p of peers){
    if(!p || typeof p.x!=="number" || typeof p.y!=="number") continue;
    if(p.tab===tabId) continue;
    seen.add(p.tab);
    paintGlove(p.tab,p.x,p.y,typeof p.pose==="string"?p.pose:"open",
               typeof p.slot==="number"?p.slot:null,typeof p.name==="string"?p.name:"");
  }
  for(const [k,el] of gloveEls) if(!seen.has(k)){ el.remove(); gloveEls.delete(k); }
}
function updateHot(ev){
  const t=ev.target.closest && ev.target.closest("[data-char]");
  const s=ev.target.closest && ev.target.closest("[data-seat]");
  const next = t ? {kind:"tile",key:t.dataset.char} : s ? {kind:"slot",key:Number(s.dataset.seat)} : null;
  if(JSON.stringify(next)===JSON.stringify(hotTarget)) return;
  hotTarget=next;
  for(const el of document.querySelectorAll(".tile.hot,.slot.hot")) el.classList.remove("hot");
  if(t) t.classList.add("hot"); else if(s) s.classList.add("hot");
}

/* ---------- roster fit ----------
   On desktop the bar, the whole roster, the seat row and the footer share one
   viewport. The bar (66px), the seat row (always reserves card + 11px) and
   the footer (fixed 32px) are the same height for every role, so the same
   window size always gives the same grid; peer gloves are drawn by viewport
   fraction and only point at the right tile when layouts match.
   A tile of width w is 2px frame + 13:9 art + 17px plate + 2px frame, i.e.
   21 + (w-4)*9/13 tall. For each row count (cols = ceil(n/rows)) take the
   widest tile that fits both ways and keep the best. If nothing reaches
   TILE_MIN the page scrolls at TILE_MIN rather than shrinking further.
   Phones (<=900px) skip this: CSS defaults (104px tiles) and scrolling.
   Only sets two custom properties on #roster; never rebuilds tiles. */
const TILE_GAP=3, TILE_EDGE=4, TILE_PLATE=17, TILE_ART=9/13, TILE_MIN=64, TILE_MAX=132;
const phoneMQ=window.matchMedia("(max-width:900px)");
function fitRoster(){
  const host=document.getElementById("roster");
  if(phoneMQ.matches){ host.style.removeProperty("--tw"); host.style.removeProperty("--cols"); return; }
  const stage=host.parentElement, bs=getComputedStyle(document.body);
  const gap=parseFloat(getComputedStyle(stage).rowGap)||0;
  let chrome=0;
  for(const el of stage.children) if(el!==host) chrome+=el.offsetHeight+gap;
  // Width as if there were no vertical scrollbar. A fitted roster never
  // overflows, so in steady state there is none; a stale one left by a
  // shrinking resize goes away because .roster has no max-width on desktop
  // and so cannot wrap into extra rows while the scrollbar is still there.
  const W=window.innerWidth-parseFloat(bs.paddingLeft)-parseFloat(bs.paddingRight);
  const H=document.documentElement.clientHeight-parseFloat(bs.paddingTop)-parseFloat(bs.paddingBottom)-chrome-1;
  const n=Math.max(1,ROSTER.length);
  let best=-Infinity, cols=1;
  for(let rows=1;rows<=n;rows++){
    const c=Math.ceil(n/rows);
    const byW=(W-(c-1)*TILE_GAP)/c;
    const byH=TILE_EDGE+((H-(rows-1)*TILE_GAP)/rows-TILE_EDGE-TILE_PLATE)/TILE_ART;
    const w=Math.min(byW,byH,TILE_MAX);
    if(w>best){ best=w; cols=c; }
  }
  if(best<TILE_MIN){
    const fit=Math.max(1,Math.floor((W+TILE_GAP)/(TILE_MIN+TILE_GAP)));
    cols=Math.ceil(n/Math.ceil(n/fit)); best=TILE_MIN;
  }
  host.style.setProperty("--tw",Math.floor(best)+"px");
  host.style.setProperty("--cols",String(cols));
}
let fitQueued=false;
function queueFit(){
  if(fitQueued) return; fitQueued=true;
  requestAnimationFrame(()=>{ fitQueued=false; fitRoster(); });
}
window.addEventListener("resize",queueFit);
if(window.ResizeObserver){
  const ro=new ResizeObserver(queueFit);
  for(const el of document.querySelector(".stage").children) if(el.id!=="roster") ro.observe(el);
}
fitRoster();

/* ---------- join ---------- */
const joinEl=document.getElementById("join");
const nameIn=document.getElementById("jn");
const goBtn=document.getElementById("go");
const pwRow=document.getElementById("pwRow");
const pwIn=document.getElementById("pw");
const pwMsg=document.getElementById("pwMsg");
const pwOk=()=>pwIn.value.trim().length>0;   // the server is the judge now
let pickedRole=null;

const escape=document.createElement("button");
escape.className="escape"; escape.type="button"; escape.textContent="change role";
escape.addEventListener("click",()=>{ try{localStorage.removeItem("elRole");}catch(e){} location.reload(); });
document.body.appendChild(escape);

nameIn.value = stored("elName") || "";
document.querySelectorAll(".roleBtn").forEach(b=>{
  b.addEventListener("click",()=>{
    pickedRole=b.dataset.role;
    document.querySelectorAll(".roleBtn").forEach(o=>o.classList.toggle("sel",o===b));
    pwRow.hidden = pickedRole!=="admin"; pwMsg.hidden=true;
    if(pickedRole==="admin") pwIn.focus();
    refreshGo();
  });
});
nameIn.addEventListener("input",refreshGo);
pwIn.addEventListener("input",()=>{ pwMsg.hidden=true; refreshGo(); });
pwIn.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  if(goBtn.disabled && !pwOk()){ pwMsg.hidden=false; return; }
  if(!goBtn.disabled) enter();
});
nameIn.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!goBtn.disabled) enter(); });
goBtn.addEventListener("click",enter);
function refreshGo(){
  const needsName = pickedRole!=="viewer" && !nameIn.value.trim();
  const needsPw = pickedRole==="admin" && !pwOk();
  goBtn.disabled = !pickedRole || needsName || needsPw;
}

/* An admin the server turned away lands back here with the box open, rather
   than on a board full of buttons that quietly do nothing. */
let pwDenied=false;
try{ pwDenied = sessionStorage.getItem("elPwBad")==="1"; sessionStorage.removeItem("elPwBad"); }catch(e){}
if(pwDenied){
  pickedRole="admin";
  document.querySelectorAll(".roleBtn").forEach(o=>o.classList.toggle("sel",o.dataset.role==="admin"));
  nameIn.value=stored("elName")||"";
  pwRow.hidden=false; pwMsg.hidden=false; refreshGo(); pwIn.focus();
}

const savedRole = stored("elRole");
if(!pwDenied && (savedRole==="player"||savedRole==="viewer"||savedRole==="admin")){
  pickedRole=savedRole; nameIn.value=stored("elName")||"";
  myPw = stored("elAdminPw")||"";              // so a reload mid-show does not re-prompt
  enter();
}

let presenceTimer=0;
function enter(){
  ROLE=pickedRole; myName=nameIn.value.trim();
  if(ROLE==="admin" && pwIn.value.trim()) myPw=pwIn.value.trim();
  try{
    localStorage.setItem("elName",myName); localStorage.setItem("elRole",ROLE);
    if(ROLE==="admin") localStorage.setItem("elAdminPw",myPw);
  }catch(e){}
  joinEl.remove();
  if(CAN_PLAY()) document.body.classList.add("gloved");

  window.addEventListener("pointermove",e=>{
    myPos={x:e.clientX/window.innerWidth,y:e.clientY/window.innerHeight};
    updateHot(e); renderGloves();
    if(live && CAN_PLAY() && !presenceTimer){
      // coalesce to ~25/s; every move is relayed, never stored
      presenceTimer=setTimeout(()=>{
        presenceTimer=0;
        sendMsg({ t:"hand", x:myPos.x, y:myPos.y, pose:myPose(), slot:mySlot(), name:myName });
      },40);
    }
  },{passive:true});

  if(CAN_PLAY()) document.addEventListener("pointerdown",onWorldPress);
  render();
  connect();
}

/* ---------- sync ----------
   One socket back to whatever served this page, so the tunnel needs a single
   ingress rule and there is no cloud account in the path. The server holds the
   room; this page holds a copy and redraws whenever a new one arrives. */
function wsUrl(){
  return (location.protocol==="https:" ? "wss://" : "ws://") + location.host;
}
function sendMsg(o){
  if(ws && ws.readyState===1){ ws.send(JSON.stringify(o)); return true; }
  return false;
}
function applyRoom(r){
  if(!r || typeof r!=="object") return;
  slots = (r.seats && typeof r.seats==="object") ? r.seats : {};
  adminLock = !!r.locked;
  applyGame(r.game);
  if(mySlot()!==null) seatFull=false;          // a seat opened up and it is ours
}
function onHand(h){
  if(h.tab===tabId) return;
  const i=peers.findIndex(p=>p.tab===h.tab);
  if(i>=0) peers[i]=h; else peers.push(h);
  renderGloves();
}
function onGone(tab){
  const i=peers.findIndex(p=>p.tab===tab);
  if(i>=0){ peers.splice(i,1); renderGloves(); }
}

/* Reconnect with backoff. Supabase gave this for free; without it an OBS
   source that drops its socket is dead for the rest of the night. */
let backoff=500;
function retry(){
  const wait=Math.round(backoff*(0.7+Math.random()*0.6));
  backoff=Math.min(5000,backoff*2);
  setTimeout(connect,wait);
}
function connect(){
  let sock;
  try{ sock=new WebSocket(wsUrl()); }catch(e){ return retry(); }
  ws=sock;
  sock.addEventListener("open",()=>{
    backoff=500; live=true;
    sendMsg({ t:"hello", viewerId:myId, name:myName, role:ROLE, tabId, pw:myPw });
    if(CAN_SEAT()) sendMsg({ t:"claim" });
    if(CAN_PLAY()) sendMsg({ t:"hand", x:myPos.x, y:myPos.y, pose:"open", slot:null, name:myName });
    renderFooter();
  });
  sock.addEventListener("message",ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.t==="state"){ applyRoom(m.room); render(); }
    else if(m.t==="hand"){ onHand(m); }
    else if(m.t==="gone"){ onGone(m.tab); }
    else if(m.t==="full"){ seatFull=true; render(); }
    else if(m.t==="denied"){
      try{
        localStorage.removeItem("elRole"); localStorage.removeItem("elAdminPw");
        sessionStorage.setItem("elPwBad","1");
      }catch(e){}
      location.reload();
    }
  });
  sock.addEventListener("close",()=>{
    if(ws!==sock) return;                       // a stale socket losing a race
    ws=null; live=false; peers=[];
    renderGloves(); renderFooter(); retry();
  });
  sock.addEventListener("error",()=>{ try{ sock.close(); }catch(e){} });
}
</script>
</body>
</html>
